<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
  <h1>Crear Cuenta</h1>
  <form th:action="@{/registro}" th:object="${usuario}" method="post">
    <div th:if="${#fields.hasErrors('nombre')}" style="color:red"
         th:errors="*{nombre}">
    </div>
    <div th:if="${#fields.hasErrors('email')}" style="color:red"
         th:errors="*{email}">
    </div>
    <label>Nombre: <input type="text" th:field="*{nombre}" required /></label>
    <label>Correo: <input type="email" th:field="*{email}" required /></label>
    <label>Contraseña: <input type="password" th:field="*{contrasenia}" required /></label>
    <!-- Thymeleaf + Spring Security incluye el token CSRF automáticamente -->
    <button type="submit">Registrarse</button>
  </form>
  <a th:href="@{/login}">¿Ya tiene cuenta? Iniciar Sesión</a>
</body>
</html>
